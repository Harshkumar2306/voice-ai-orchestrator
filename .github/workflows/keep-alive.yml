name: Keep Alive Free Tier Backend

on:
  schedule:
    # Run every 14 minutes (Render sleeps after 15 minutes of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          TARGET_URL="${{ secrets.BACKEND_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://voice-ai-orchestrator.onrender.com/api/health"
          fi
          echo "Pinging backend at $TARGET_URL to prevent free-tier sleep..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$TARGET_URL" || echo "failed")
          echo "HTTP Response Status: $HTTP_STATUS"
